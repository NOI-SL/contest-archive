title: NOI Sri Lanka — Contest Archive
description: >-
  Problem statements from the National Olympiad in Informatics Sri Lanka —
  final rounds, selection and qualifier rounds, and monthly contests.
# Served from the custom domain in ./CNAME. If that is ever removed, the site falls
# back to https://noi-sl.github.io/contest-archive/ and baseurl must become /contest-archive.
url: https://archive.noi.lk
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
  # Statements rely on blank lines for paragraphs, not on single newlines.
  hard_wrap: false
  # Renders $$...$$ into <script type="math/tex"> tags, which MathJax picks up.
  math_engine: mathjax
  syntax_highlighter: rouge

collections:
  problems:
    output: true
    # _problems/2022/finals/day-1/01-two-spindles.md  ->  /2022/finals/day-1/01-two-spindles/
    permalink: /:path/

defaults:
  - scope:
      path: ""
      type: problems
    values:
      layout: problem

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
