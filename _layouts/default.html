<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_newlines }}">
<link rel="icon" href="{{ '/assets/img/logo.png' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<!-- kramdown's mathjax engine turns $$...$$ into \(...\) inline and \[...\] display. -->
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [["\\(", "\\)"]],
      displayMath: [["\\[", "\\]"]],
      skipTags: ["script", "noscript", "style", "textarea", "pre", "code"]
    }
  });
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@2.7.9/MathJax.js?config=TeX-MML-AM_CHTML"></script>
</head>
<body>

<header>
  <a class="brand" href="{{ '/' | relative_url }}">
    <img src="{{ '/assets/img/logo-mark.png' | relative_url }}" alt="">
    <span>NOI Contest Archive</span>
  </a>
  <nav>
    <a href="https://noi.lk">noi.lk</a>
    <a href="https://github.com/NOI-SL/contest-archive">GitHub</a>
  </nav>
</header>

<main>
{{ content }}
</main>

<footer>
  <p>Copyright remains with the National Olympiad in Informatics Sri Lanka and the problem authors.</p>
</footer>

</body>
</html>
