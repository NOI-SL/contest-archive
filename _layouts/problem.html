---
layout: default
---

<p class="crumb">
  <a href="{{ '/' | relative_url }}">Archive</a> /
  <a href="{{ '/#' | append: page.year | relative_url }}">{{ page.year }}</a> /
  {{ page.round }}
</p>

<h1>{{ page.title }}</h1>

<p class="meta">
  {% if page.difficulty %}{{ page.difficulty }} ·{% endif %}
  {{ page.contest_name }}
</p>

<div class="statement">
{{ content }}
</div>

<p class="links">
  <a href="{{ page.problem_url }}">Open on HackerRank ↗</a> ·
  <a href="https://github.com/NOI-SL/contest-archive/blob/main/{{ page.path }}">Markdown source</a> ·
  <a href="{{ '/' | relative_url }}">Back to the archive</a>
</p>
